schema_version: 1
status: SUPERSEDED
proposal_version: proposal-v1
role_id: assembly
read_scope: ['project/**']
write_scope:
  - 'src/main.py'
  - 'src/interface/cli.py'
  - 'pyproject.toml'
  - '.gitignore'
  - '.ans/roles/assembly/feature-map.md'
  - '.ans/roles/assembly/functional-description.md'
  - '.ans/roles/assembly/api-spec.md'
  - '.ans/roles/assembly/changelog.md'
  - '.ans/roles/assembly/docs/design/'
  - '.ans/roles/assembly/docs/feature/'
  - '.ans/roles/assembly/docs/change/'
  - '.ans/roles/assembly/docs/fix/'
  - 'src/common/assembly/'
  - 'tests/assembly/'
deny_scope:
  - '其他角色的源文件、私有 common 和 tests'
  - '.ans/roles/*/role.yaml'
  - '.ans/roles/*/boundary.yaml'
  - '.ans/roles/*/role-card.md'
  - '.ans/roles/*/boundary.md'
  - '.ans/project.yaml'
  - '.ans/organization/'
  - '.ans/approvals/'
  - '.ans/events/'
  - ''
activation_requires: [human_accepted_boundary, authorized_task, fixed_role_context]
required_approvals: [human_for_scope_or_organization_change]
delegation_scope: []
